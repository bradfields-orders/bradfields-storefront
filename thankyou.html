<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - Bradfield's Computer Supply</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .thank-you {
      max-width: 700px;
      margin: 80px auto;
      padding: 40px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .thank-you h1 {
      color: #28a745;
      margin-bottom: 20px;
    }
    .thank-you p {
      font-size: 1.1rem;
      color: #555;
    }
    .thank-you a {
      display: inline-block;
      margin-top: 30px;
      background-color: #007bff;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }
    .thank-you a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="thank-you">
    <h1>✅ Order Placed!</h1>
    <p>Thank you for your order with Bradfield's Computer Supply.<br>
    A confirmation email has been sent and your Zebra label media request is being processed.</p>
    <a href="index.html">Return to Store</a>
  </div>
</body>
</html>
